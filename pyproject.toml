[project]
name = "skyguard-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]>=0.30.0",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "SQLAlchemy==2.1.3",
    "psycopg[binary]>=3.2.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.fastapi.static]
exclude = true
